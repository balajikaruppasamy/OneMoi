# Build check on every push / pull request (free GitHub Actions minutes).
# If this is red, Render would also fail to deploy — fix it before merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: API (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/backend/global.json
      - run: dotnet restore OneMoi.sln
      - run: dotnet build OneMoi.sln -c Release --no-restore

  frontend:
    name: Web (Angular 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/onemoi-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/onemoi-web/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
