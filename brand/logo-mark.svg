      <stop offset="0" stop-color="#A8264F"/>
      <stop offset="1" stop-color="#6A0F28"/>
    </linearGradient>
    <linearGradient id="omCoin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#E08E00"/>
