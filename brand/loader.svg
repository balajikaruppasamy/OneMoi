<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Loading">
  <!-- Self-animating loader: ring spins, M flap draws, rupee coin drops in as the seal. Usable in <img>, WebView, Flutter (flutter_svg static) or as Lottie reference. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A8264F"/><stop offset="1" stop-color="#6A0F28"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC94A"/><stop offset="1" stop-color="#E08E00"/></linearGradient>
  </defs>
  <circle cx="80" cy="80" r="74" fill="none" stroke="#F2A516" stroke-opacity=".18" stroke-width="5"/>
  <circle cx="80" cy="80" r="74" fill="none" stroke="#F2A516" stroke-width="5" stroke-linecap="round" stroke-dasharray="110 355">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(20 20)">
    <rect width="120" height="120" rx="28" fill="url(#bg)"/>
    <rect x="22" y="34" width="76" height="56" rx="10" fill="#FFF9F0"/>
    <path d="M34 80V48l26 20 26-20v32" fill="none" stroke="#8E1B3A" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="130" stroke-dashoffset="130">
      <animate attributeName="stroke-dashoffset" values="130;0;0;130" keyTimes="0;.45;.85;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -46;0 -46;0 4;0 0;0 0;0 0" keyTimes="0;.35;.55;.62;.85;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.35;.5;.62;.85;1" dur="2.4s" repeatCount="indefinite"/>
      <circle cx="60" cy="68" r="13" fill="url(#coin)" stroke="#FFF9F0" stroke-width="3.5"/>
      <path d="M55 62.5h10M55 66h10M55 62.5h3.2a3.6 3.6 0 0 1 0 7.2H55l7 6" fill="none" stroke="#6A0F28" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
