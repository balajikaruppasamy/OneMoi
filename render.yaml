# Render Blueprint — creates both OneMoi services on Render's FREE plan.
# Render dashboard → New → Blueprint → pick this GitHub repo → Apply.
# Values marked "sync: false" are secrets: Render asks for them once and keeps them (never in GitHub).

services:
  # ── .NET 10 API (Docker) ──────────────────────────────────────────────
  - type: web
    name: onemoi-api                  # → https://onemoi-api.onrender.com
    runtime: docker
    plan: free
    region: singapore                 # closest free region to India — pick the same region as your Supabase project if possible
    rootDir: src/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true                  # every push to main redeploys
    envVars:
      - key: ConnectionStrings__OneMoi          # Supabase "Session pooler" connection string (see docs/DEPLOYMENT.md)
        sync: false
      - key: Jwt__Key                           # random secret generated by Render
        generateValue: true
      - key: App__OtpSecret
        generateValue: true
      - key: App__ExposeOtpInResponse           # TEST PHASE ONLY: shows the OTP on screen because real SMS is not connected yet
        value: "true"
      - key: Cors__Origins__0                   # the web app URL allowed to call the API
        value: https://onemoi-web.onrender.com
      - key: Storage__Provider                  # logos go to Supabase Storage (Render's disk is wiped on restart)
        value: Supabase
      - key: Supabase__Url                      # https://YOUR-PROJECT.supabase.co
        sync: false
      - key: Supabase__ServiceKey               # Supabase → Project Settings → API → service_role key
        sync: false
      - key: Supabase__Bucket
        value: onemoi
      - key: Swagger__Enabled                   # API test page at /swagger during testing
        value: "true"
      - key: Database__SeedDemoData             # data was restored from your local backup
        value: "false"

  # ── Angular web app (static site) ─────────────────────────────────────
  - type: web
    name: onemoi-web                  # → https://onemoi-web.onrender.com
    runtime: static
    rootDir: src/frontend/onemoi-web
    buildCommand: npm ci && npx ng build --configuration production
    staticPublishPath: dist/onemoi-web/browser
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite                 # Angular routes (/vendor/dashboard …) all serve index.html
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: NODE_VERSION
        value: "22"
